<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title description">
  <title id="title">Aquahab: the crew that remembers</title>
  <desc id="description">Deep-sea Aquahab banner with five crew signals flowing into a memory vault.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050B17"/><stop offset=".58" stop-color="#0A213A"/><stop offset="1" stop-color="#102F4F"/></linearGradient>
    <linearGradient id="current" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5EE7F0" stop-opacity=".1"/><stop offset=".4" stop-color="#5EE7F0"/><stop offset=".78" stop-color="#4DA2FF"/><stop offset="1" stop-color="#5EE7F0" stop-opacity=".1"/></linearGradient>
    <radialGradient id="vault" cx="50%" cy="50%" r="50%"><stop stop-color="#5EE7F0" stop-opacity=".56"/><stop offset="1" stop-color="#5EE7F0" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="480" rx="28" fill="url(#background)"/>
  <g opacity=".32" fill="#5EE7F0"><circle cx="114" cy="105" r="3"/><circle cx="256" cy="360" r="5"/><circle cx="1050" cy="90" r="4"/><circle cx="1430" cy="140" r="3"/><circle cx="1500" cy="390" r="5"/></g>
  <circle cx="1296" cy="242" r="154" fill="url(#vault)"/>
  <path d="M720 240C860 145 945 355 1084 240s214-95 360 0" fill="none" stroke="url(#current)" stroke-linecap="round" stroke-width="8" opacity=".75"/>
  <g fill="#0A1628" stroke="#5EE7F0" stroke-width="3"><circle cx="828" cy="191" r="32"/><circle cx="962" cy="285" r="32"/><circle cx="1093" cy="220" r="32"/><circle cx="1212" cy="272" r="32"/><circle cx="1390" cy="239" r="32"/></g>
  <g fill="#A8F0F5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle"><text x="828" y="196">ONE</text><text x="962" y="290">RESEARCH</text><text x="1093" y="225">BUILD</text><text x="1212" y="277">GROW</text><text x="1390" y="244">FINANCE</text></g>
  <g transform="translate(105 120)" fill="none" stroke="#5EE7F0" stroke-linecap="round" filter="url(#glow)"><path d="M6 110C46 36 110 36 150 110s104 74 144 0" stroke-width="20"/><circle cx="6" cy="110" r="14" fill="#5EE7F0" stroke="none"/><circle cx="294" cy="110" r="14" fill="#5EE7F0" stroke="none"/><path d="M57 142c23 31 52 31 75 0s52-31 75 0" stroke-width="10" opacity=".85"/></g>
  <text x="105" y="300" fill="#EAF2F7" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="700" letter-spacing="-4">AQUAHAB</text>
  <text x="111" y="351" fill="#A8F0F5" font-family="Arial, Helvetica, sans-serif" font-size="25" letter-spacing="3">THE CREW THAT REMEMBERS THE WORK</text>
  <text x="111" y="397" fill="#A9BCD0" font-family="Arial, Helvetica, sans-serif" font-size="20">Real project context, stored on Walrus Memory and checked on Sui.</text>
  <g transform="translate(1270 187)" fill="none" stroke="#5EE7F0" stroke-width="5"><circle cx="26" cy="55" r="54"/><path d="M2 55h48M26 31v48"/></g>
</svg>
